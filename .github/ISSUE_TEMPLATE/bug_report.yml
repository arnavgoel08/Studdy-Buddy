name: Bug report
description: Report a reproducible Study Buddy problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Thanks! Please remove API keys, passwords, and private notes from any screenshots or logs."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the actual and expected behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open…\n2. Click…\n3. See error…"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser, operating system and device
      placeholder: "Chrome 130, Windows 11, laptop"
  - type: dropdown
    id: ai
    attributes:
      label: Is the issue related to browser AI?
      options: ["Yes", "No", "Not sure"]
